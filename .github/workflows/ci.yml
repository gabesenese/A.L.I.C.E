name: CI

on: [push, pull_request]

# A newer push makes an in-flight run for the same ref redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      # requirements-dev pulls in requirements-api, which carries fastapi,
      # uvicorn and pydantic-settings. tests/conftest.py imports app.main at
      # collection time, so without them the whole suite fails to collect.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # NLTK corpora are a separate download. The runtime degrades without them
      # (see ai/core/nltk_support), so a fetch failure is not a build failure —
      # it just means CI exercises the fallback tokenizer instead.
      - run: python scripts/setup_nltk.py
        continue-on-error: true
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest tests/ --cov=ai --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
