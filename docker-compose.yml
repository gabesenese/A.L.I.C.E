services:
  alice:
    build: .
    ports: ["8000:8000"]
    environment:
      - ALICE_OLLAMA_HOST=http://ollama:11434
      - ALICE_LOG_LEVEL=INFO
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Opt-in GPU. A `reservations.devices` block for an nvidia driver is a hard
  # requirement, not a preference: on a machine without one — every Mac, and
  # most Linux desktops — `docker compose up` fails outright rather than falling
  # back to CPU. A local assistant has to start on the machine it is on.
  #
  #   docker compose --profile gpu up --build
  #
  # runs the same Ollama with the GPU attached instead.
  ollama-gpu:
    extends:
      service: ollama
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_models:
